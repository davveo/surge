<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surge IM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wechat: "#07c160",
            bubble: "#95ec69",
            rail: "#2e2e2e",
            mid: "#eaeaea",
            chat: "#f5f5f5",
          },
          fontFamily: {
            sans: ["-apple-system", "BlinkMacSystemFont", "PingFang SC", "Noto Sans SC", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="h-full m-0 bg-zinc-300 text-zinc-900 font-sans">
  <div id="login" class="min-h-full grid place-items-center bg-rail">
    <div class="w-[360px] rounded-lg bg-white px-7 py-8 shadow-lg">
      <h1 class="m-0 mb-2 text-[28px] font-semibold">Surge</h1>
      <p class="mb-4 text-[13px] text-zinc-500">Web 三栏 · 单聊 / 群聊</p>
      <input id="login-uid" class="mb-3 h-10 w-full rounded border border-zinc-300 px-3 text-sm outline-none focus:border-wechat" placeholder="uid / 邮箱 / 手机号" autofocus />
      <input id="login-email" class="mb-3 h-10 w-full rounded border border-zinc-300 px-3 text-sm outline-none focus:border-wechat" placeholder="注册邮箱（可选）" />
      <input id="login-phone" class="mb-3 h-10 w-full rounded border border-zinc-300 px-3 text-sm outline-none focus:border-wechat" placeholder="注册手机号（可选）" />
      <input id="login-pass" type="password" class="mb-3 h-10 w-full rounded border border-zinc-300 px-3 text-sm outline-none focus:border-wechat" placeholder="密码（可空则走开发登录）" />
      <button id="login-btn" type="button" class="h-10 w-full rounded bg-wechat text-sm text-white hover:bg-[#06ad56]">登录</button>
      <button id="register-btn" type="button" class="mt-2 h-10 w-full rounded border border-zinc-300 bg-white text-sm text-zinc-800 hover:bg-zinc-50">注册</button>
      <button id="oauth-demo-btn" type="button" class="mt-2 h-10 w-full rounded border border-zinc-300 bg-white text-sm text-zinc-800 hover:bg-zinc-50">第三方登录（演示）</button>
      <a id="oauth-github" href="/v1/auth/oauth/github" class="mt-2 flex h-10 w-full items-center justify-center rounded border border-zinc-300 bg-white text-sm text-zinc-800 hover:bg-zinc-50">GitHub 登录</a>
      <div class="my-4 text-center">
        <img id="qr-img" class="mx-auto h-[180px] w-[180px] bg-zinc-100" alt="登录二维码" />
        <p id="qr-hint" class="mt-3 text-[13px] leading-relaxed text-zinc-500">已登录窗口打开本页扫码，或点确认登录</p>
      </div>
      <p class="text-[13px] leading-relaxed text-zinc-500">两个窗口分别登录 u1 / u2，先加好友再发消息；通讯录可建群。图片走 MinIO 预签名直传。</p>
    </div>
  </div>

  <div id="confirm-qr" class="hidden min-h-full grid place-items-center bg-rail">
    <div class="w-[360px] rounded-lg bg-white px-7 py-8 shadow-lg">
      <h1 class="m-0 mb-2 text-[28px] font-semibold">确认登录</h1>
      <p class="mb-4 text-[13px] text-zinc-500">网页版正在请求登录，是否允许？</p>
      <button id="qr-approve" type="button" class="h-10 w-full rounded bg-wechat text-sm text-white hover:bg-[#06ad56]">确认登录</button>
      <button id="qr-deny" type="button" class="mt-2 h-10 w-full rounded border border-zinc-300 bg-white text-sm text-zinc-800 hover:bg-zinc-50">取消</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside class="rail">
      <div id="me" title="修改昵称"></div>
      <nav class="rail-nav">
        <button class="rail-btn on" data-tab="chats" title="会话" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 4.4A2.4 2.4 0 0 1 6.6 2h10.8A2.4 2.4 0 0 1 20 4.4v9.2a2.4 2.4 0 0 1-2.4 2.4H9.1L4.6 19.5A.8.8 0 0 1 3.3 18.9V4.4Z"/></svg>
        </button>
        <button class="rail-btn" data-tab="contacts" title="通讯录" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12.2a4.1 4.1 0 1 0-4.1-4.1A4.1 4.1 0 0 0 12 12.2Zm0 1.8c-3.4 0-8 1.7-8 5.1V21h16v-1.9c0-3.4-4.6-5.1-8-5.1Z"/></svg>
        </button>
      </nav>
      <div class="rail-spacer"></div>
      <button id="logout" type="button" class="rail-btn" title="退出">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v2h-1.6v-2a.9.9 0 0 0-.9-.9h-11a.9.9 0 0 0-.9.9v11a.9.9 0 0 0 .9.9h11a.9.9 0 0 0 .9-.9v-2H20v2a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Zm12.2 8.2-1.1-1.1 1.6-1.6H10v-1.6h6.7l-1.6-1.6 1.1-1.1 3.5 3.5-3.5 3.5Z"/></svg>
      </button>
    </aside>

    <section class="mid">
      <div id="pane-chats">
        <header class="mid-head">
          <label class="search-wrap">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 1.8a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6Zm0 1.5a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Zm5.2 7.1 2.7 2.7-1.1 1.1-2.7-2.7 1.1-1.1Z"/></svg>
            <input id="global-search" placeholder="搜索" />
          </label>
          <button id="new-chat-btn" type="button" title="添加好友 / 建群">+</button>
        </header>
        <div id="global-hits" class="hidden"></div>
        <div id="conv-list"></div>
      </div>
      <div id="pane-contacts" class="hidden">
        <header class="mid-head contacts-head">通讯录</header>
        <form id="add-form" class="mid-form">
          <input id="add-uid" placeholder="搜索 / 添加 uid" autocomplete="off" />
          <button type="submit">添加</button>
        </form>
        <div id="search-hits"></div>
        <div id="req-wrap">
          <div class="mid-label">好友申请</div>
          <div id="req-list"></div>
        </div>
        <form id="group-form" class="mid-form wrap">
          <input id="group-name" placeholder="群名" />
          <input id="group-members" placeholder="成员 uid，逗号分隔" />
          <button type="submit">建群</button>
        </form>
        <div id="friend-list"></div>
        <div id="tag-groups"></div>
        <div id="block-wrap">
          <div class="mid-label">黑名单</div>
          <div id="block-list"></div>
        </div>
      </div>
    </section>

    <section class="chat">
      <div class="chat-main">
      <header class="chat-head">
        <div class="chat-head-main">
          <div id="chat-title">选择一个会话</div>
          <div id="chat-sub"></div>
        </div>
        <div class="chat-head-actions">
          <button id="chat-menu-btn" type="button" title="聊天信息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
          </button>
        </div>
      </header>
      <div id="chat-search-bar" class="hidden">
        <input id="chat-search" placeholder="搜索聊天记录" />
      </div>
      <div id="msgs"></div>
      <div id="select-bar" class="hidden">
        <span id="select-count">已选 0</span>
        <button id="select-fwd" type="button">转发</button>
        <button id="select-cancel" type="button">取消</button>
      </div>
      <div id="typing" class="hidden">对方正在输入…</div>
      <div id="quote-bar" class="hidden">
        <span id="quote-text"></span>
        <button id="quote-clear" type="button">×</button>
      </div>
      <div id="upload-progress" class="hidden"><div id="upload-bar"></div></div>
      <form id="send-form">
        <div id="mention-box" class="hidden"></div>
        <div class="composer-tools">
          <button id="emoji-btn" type="button" disabled title="表情">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M8.4 14.2c1 1.5 2.3 2.2 3.6 2.2s2.6-.7 3.6-2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div id="emoji-box" class="hidden"></div>
          <button id="attach-btn" type="button" disabled title="文件">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 7.2h4.2l1.3-1.4h7.5A1.5 1.5 0 0 1 20 7.3v10.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5V8.7a1.5 1.5 0 0 1 1.5-1.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button id="shot-btn" type="button" disabled title="截图 / 图片">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 7.2 10 4.8h4l1.8 2.4H19a1.4 1.4 0 0 1 1.4 1.4v8.2A1.4 1.4 0 0 1 19 18H5a1.4 1.4 0 0 1-1.4-1.4V8.6A1.4 1.4 0 0 1 5 7.2h3.2Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12.2" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button id="rec-btn" type="button" disabled title="按住录音">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4.5" width="6" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 11.5a5 5 0 0 0 10 0M12 16.5v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <label id="burn-label" title="对方打开后数秒销毁">
            <input id="burn-toggle" type="checkbox" />阅后即焚
          </label>
          <input id="file" type="file" accept="image/*,audio/*,*/*" class="hidden" />
        </div>
        <textarea id="draft" rows="3" placeholder="" disabled></textarea>
        <div class="composer-foot">
          <button id="send-btn" type="submit" disabled>发送</button>
        </div>
      </form>
      </div>
      <aside id="chat-side" class="hidden">
        <div id="side-direct" class="hidden">
          <div id="side-peer-card" class="side-profile"></div>
        </div>
        <div id="group-bar" class="hidden">
          <div class="side-search">
            <input id="member-search" placeholder="搜索群成员" autocomplete="off" />
          </div>
          <div id="member-chips" class="side-members"></div>
          <div id="side-invite" class="side-invite hidden">
            <input id="invite-uid" placeholder="输入好友账号" autocomplete="off" />
            <button id="invite-btn" type="button">添加</button>
          </div>
          <div class="side-list">
            <button type="button" class="side-row" id="rename-row">
              <span>群聊名称</span>
              <span class="side-val" id="side-group-name"></span>
            </button>
            <button type="button" class="side-row" id="announce-row">
              <span>群公告</span>
              <span class="side-val" id="side-announce"></span>
            </button>
            <button type="button" class="side-row" id="mynick-row">
              <span>我在本群的昵称</span>
              <span class="side-val" id="side-my-nick"></span>
            </button>
            <button type="button" class="side-row" id="join-approval-btn">
              <span>进群需验证</span>
              <span class="side-switch" id="join-approval-switch"></span>
            </button>
            <input id="group-rename" class="hidden" />
            <button id="rename-btn" type="button" class="hidden">改名</button>
            <button type="button" class="side-row" id="group-avatar-btn">
              <span>群头像</span>
              <span class="side-val" id="side-group-avatar"></span>
            </button>
            <input id="group-avatar-file" type="file" accept="image/*" class="hidden" />
          </div>
        </div>
        <div id="side-shared" class="hidden">
          <div class="side-list">
            <button id="remark-btn" type="button" class="side-row hidden">
              <span>备注</span>
              <span class="side-val" id="side-remark-val"></span>
            </button>
            <button id="tag-btn" type="button" class="side-row hidden">
              <span>标签</span>
              <span class="side-val" id="side-tag-val"></span>
            </button>
            <button id="chat-search-toggle" type="button" class="side-row">查找聊天内容</button>
            <button id="mute-btn" type="button" class="side-row">
              <span>消息免打扰</span>
              <span class="side-switch" id="mute-switch"></span>
            </button>
            <button id="pin-btn" type="button" class="side-row">
              <span>置顶聊天</span>
              <span class="side-switch" id="pin-switch"></span>
            </button>
            <button id="e2ee-btn" type="button" class="side-row hidden">
              <span>端到端加密</span>
              <span class="side-switch" id="e2ee-switch"></span>
            </button>
            <div id="e2ee-fp" class="side-note hidden"></div>
            <button id="hide-btn" type="button" class="side-row">隐藏会话</button>
            <button id="clear-btn" type="button" class="side-row">清空聊天记录</button>
            <button id="qr-card-btn" type="button" class="side-row hidden">名片二维码</button>
            <button id="devices-btn" type="button" class="side-row">登录设备</button>
            <button id="block-btn" type="button" class="side-row danger hidden">加入黑名单</button>
          </div>
          <div id="side-group-admin" class="side-list hidden">
            <button id="mute-all-btn" type="button" class="side-row hidden">全员禁言</button>
            <div id="join-req-wrap" class="hidden">
              <div class="mid-label">入群申请</div>
              <div id="join-req-list"></div>
            </div>
            <button id="transfer-btn" type="button" class="side-row hidden">转让群主</button>
            <button id="leave-btn" type="button" class="side-row danger">退出群聊</button>
            <button id="dissolve-btn" type="button" class="side-row danger hidden">解散群聊</button>
          </div>
          <div id="conn-state" class="side-conn">未连接</div>
        </div>
      </aside>
    </section>
  </div>
  <div id="msg-menu" class="hidden"></div>
  <div id="readers-box" class="overlay hidden">
    <div class="modal-card">
      <div class="modal-title">已读详情</div>
      <div id="readers-list" class="modal-body"></div>
      <div class="modal-actions">
        <button id="readers-ok" type="button" class="btn-primary">确定</button>
      </div>
    </div>
  </div>
  <div id="qr-card-box" class="overlay hidden">
    <div class="modal-card">
      <div class="modal-title">扫一扫加我为好友</div>
      <div class="modal-body" style="text-align:center"><img id="qr-card-img" alt="" /></div>
      <div class="modal-actions">
        <button id="qr-card-close" type="button" class="btn-ghost">关闭</button>
      </div>
    </div>
  </div>
  <div id="devices-box" class="overlay hidden">
    <div class="modal-card">
      <div class="modal-title">登录设备</div>
      <div id="devices-list" class="modal-body"></div>
      <div class="modal-actions">
        <button id="devices-ok" type="button" class="btn-ghost">关闭</button>
      </div>
    </div>
  </div>
  <div id="lightbox" class="overlay hidden">
    <img id="lightbox-img" alt="" />
  </div>
  <div id="forward-box" class="overlay hidden">
    <div class="modal-card forward-panel">
      <header>转发到</header>
      <div id="forward-list"></div>
      <div class="modal-actions">
        <button id="forward-cancel" type="button" class="btn-ghost">取消</button>
      </div>
    </div>
  </div>
  <div id="modal" class="overlay hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <input id="modal-input" class="modal-input hidden" autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="btn-ghost">取消</button>
        <button id="modal-ok" type="button" class="btn-primary">确定</button>
      </div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
