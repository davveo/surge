<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surge IM</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="login" class="login">
    <div class="login-card">
      <h1>Surge</h1>
      <p>Web 三栏 · 单聊 / 群聊</p>
      <input id="login-uid" placeholder="uid / 邮箱 / 手机号" autofocus />
      <input id="login-pass" type="password" placeholder="密码（可空则走开发登录）" />
      <button id="login-btn" type="button">登录</button>
      <button id="register-btn" type="button" class="ghost">注册</button>
      <div class="qr-box">
        <img id="qr-img" alt="登录二维码" />
        <p id="qr-hint" class="hint">已登录窗口打开本页扫码，或点确认登录</p>
      </div>
      <p class="hint">两个窗口分别登录 u1 / u2，先加好友再发消息；通讯录可建群。图片走 MinIO 预签名直传。</p>
    </div>
  </div>

  <div id="confirm-qr" class="login hidden">
    <div class="login-card">
      <h1>确认登录</h1>
      <p>网页版正在请求登录，是否允许？</p>
      <button id="qr-approve" type="button">确认登录</button>
      <button id="qr-deny" type="button" class="ghost">取消</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="rail">
      <button class="rail-btn active" data-tab="chats" title="会话">会话</button>
      <button class="rail-btn" data-tab="contacts" title="通讯录">通讯录</button>
      <div class="rail-spacer"></div>
      <div id="me" class="me"></div>
      <button id="logout" type="button" class="rail-btn">退出</button>
    </aside>

    <section class="mid">
      <div id="pane-chats">
        <header class="mid-head">会话</header>
        <div id="conv-list" class="list"></div>
      </div>
      <div id="pane-contacts" class="hidden">
        <header class="mid-head">通讯录</header>
        <form id="add-form" class="add-form">
          <input id="add-uid" placeholder="搜索 / 添加 uid" autocomplete="off" />
          <button type="submit">添加</button>
        </form>
        <div id="search-hits" class="list search-hits"></div>
        <form id="group-form" class="add-form col">
          <input id="group-name" placeholder="群名" />
          <input id="group-members" placeholder="成员 uid，逗号分隔" />
          <button type="submit">建群</button>
        </form>
        <div id="friend-list" class="list"></div>
      </div>
    </section>

    <section class="chat">
      <header class="chat-head">
        <div>
          <div id="chat-title" class="chat-title">选择一个会话</div>
          <div id="chat-sub" class="chat-sub"></div>
        </div>
        <div class="head-right">
          <button id="pin-btn" type="button" class="ghost-btn hidden">置顶</button>
          <button id="mute-btn" type="button" class="ghost-btn hidden">免打扰</button>
          <div id="conn-state" class="conn">未连接</div>
        </div>
      </header>
      <div id="group-bar" class="group-bar hidden">
        <input id="invite-uid" placeholder="拉好友进群" />
        <button id="invite-btn" type="button">邀请</button>
        <input id="group-rename" placeholder="改群名" />
        <button id="rename-btn" type="button">改名</button>
        <button id="group-avatar-btn" type="button">群头像</button>
        <input id="group-avatar-file" type="file" accept="image/*" class="hidden" />
        <div id="member-chips" class="chips"></div>
      </div>
      <div id="msgs" class="msgs"></div>
      <div id="typing" class="typing hidden">对方正在输入…</div>
      <div id="quote-bar" class="quote-bar hidden">
        <span id="quote-text"></span>
        <button id="quote-clear" type="button">×</button>
      </div>
      <div id="upload-progress" class="progress hidden"><div id="upload-bar"></div></div>
      <div id="mention-box" class="mention-box hidden"></div>
      <form id="send-form" class="composer">
        <button id="attach-btn" type="button" class="attach" disabled>+</button>
        <input id="file" type="file" class="hidden" />
        <textarea id="draft" rows="3" placeholder="发消息…" disabled></textarea>
        <button type="submit" disabled>发送</button>
      </form>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
