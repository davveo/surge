syntax = "proto3";

package surge.im.v1;

option go_package = "github.com/davveo/surge/proto/gen/im/v1;imv1";

import "proto/im/v1/frame.proto";

// IMCore is the stateless message service. Gateway holds TCP; this service persists.
service IMCore {
  rpc Send(SendMessageRequest) returns (SendMessageResponse);
  rpc Sync(SyncInboxRequest) returns (SyncInboxResponse);
  rpc Watermark(WatermarkRequest) returns (WatermarkResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc LookupUser(LookupUserRequest) returns (LookupUserResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc Register(RegisterRequest) returns (UserProfile);
  rpc VerifyPassword(LoginRequest) returns (UserProfile);
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc InviteGroup(InviteGroupRequest) returns (GroupResponse);
  rpc KickGroup(KickGroupRequest) returns (GroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (GroupResponse);
  rpc Recall(RecallMessageRequest) returns (RecallNotify);
  rpc MarkRead(MarkReadRequest) returns (ReadReceipt);
  rpc FanoutTyping(Typing) returns (Typing);
  rpc SetMute(SetMuteRequest) returns (MuteState);
  rpc ListMutes(ListMutesRequest) returns (ListMutesResponse);
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc RequestFriend(AddFriendRequest) returns (FriendRequestState);
  rpc AcceptFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc DeclineFriend(AddFriendRequest) returns (FriendRequestState);
  rpc ListFriendRequests(ListFriendsRequest) returns (ListFriendRequestsResponse);
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser(BlockUserRequest) returns (BlockUserResponse);
  rpc ListBlocks(ListFriendsRequest) returns (ListBlocksResponse);
  rpc SetRemark(SetRemarkRequest) returns (Friend);
  rpc LeaveGroup(LeaveGroupRequest) returns (GroupResponse);
  rpc DissolveGroup(LeaveGroupRequest) returns (GroupResponse);
  rpc TransferOwner(TransferOwnerRequest) returns (GroupResponse);
  rpc HideConversation(HideConversationRequest) returns (HideConversationResponse);
  rpc SetPin(SetMuteRequest) returns (MuteState);
  rpc GetReadState(GetReadStateRequest) returns (GetReadStateResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SetGroupMuteAll(SetMuteRequest) returns (GroupResponse);
  rpc SetFriendTags(SetFriendTagsRequest) returns (Friend);
  rpc ListFriendTags(ListFriendsRequest) returns (ListFriendTagsResponse);
  rpc SetPublicKey(SetPublicKeyRequest) returns (UserProfile);
  rpc GetPublicKeys(GetProfilesRequest) returns (GetProfilesResponse);
  rpc ConsumeEphemeral(RecallMessageRequest) returns (RecallNotify);
  rpc AddSticker(AddStickerRequest) returns (Sticker);
  rpc ListStickers(ListFriendsRequest) returns (ListStickersResponse);
  rpc DeleteMessage(RecallMessageRequest) returns (HideConversationResponse);
  rpc ClearConversation(HideConversationRequest) returns (HideConversationResponse);
  rpc SetMember(SetMemberRequest) returns (GroupResponse);
  rpc ListJoinRequests(GetGroupRequest) returns (ListJoinRequestsResponse);
  rpc RequestJoin(LeaveGroupRequest) returns (GroupResponse);
  rpc DecideJoin(DecideJoinRequest) returns (GroupResponse);
  rpc ReactMessage(ReactMessageRequest) returns (ReactionList);
  rpc AddFavorite(FavoriteRequest) returns (Favorite);
  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse);
  rpc DeleteFavorite(FavoriteRequest) returns (HideConversationResponse);
  rpc CreateGroupInvite(GetGroupRequest) returns (GroupInvite);
  rpc JoinByInvite(JoinInviteRequest) returns (GroupResponse);
  rpc SetDraft(SetDraftRequest) returns (HideConversationResponse);
  rpc PinChatMessage(PinChatMessageRequest) returns (PinnedMessage);
  rpc GetPinnedMessage(GetGroupRequest) returns (PinnedMessage);
  rpc ReportMessage(ReportRequest) returns (HideConversationResponse);
  rpc GetSettings(ListFriendsRequest) returns (UserSettings);
  rpc SetSettings(UserSettings) returns (UserSettings);
}

message WatermarkRequest {
  string uid = 1;
}

message WatermarkResponse {
  uint64 last_sync_seq = 1;
}

message SendMessageRequest {
  string from_uid = 1;
  string client_msg_id = 2;
  string cid = 3;
  string peer_uid = 4;
  Payload payload = 5;
  string quote_msg_id = 6;
}

message RecipientHint {
  string uid = 1;
  string gateway_id = 2;
  string conn_id = 3;
}

message SendMessageResponse {
  Ack ack = 1;
  string peer_uid = 2;
  Push peer_push = 3;
  RecipientHint peer_route = 4;
  repeated RecipientHint fanout_routes = 5;
}

message SyncInboxRequest {
  string uid = 1;
  uint64 last_sync_seq = 2;
  uint32 limit = 3;
}

message SyncInboxResponse {
  SyncResponse sync = 1;
}

message ListConversationsRequest {
  string uid = 1;
}

message Conversation {
  string cid = 1;
  string peer_uid = 2;
  string last_msg_id = 3;
  uint64 last_conv_seq = 4;
  uint32 unread = 5;
  int64 updated_at_ms = 6;
  string last_text = 7;
  string title = 8;
  string kind = 9;
  bool muted = 10;
  bool pinned = 11;
  UserProfile peer_profile = 12;
  uint32 unread_mention = 13;
  string draft_text = 14;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetTimelineRequest {
  string uid = 1;
  string cid = 2;
  uint64 after_conv_seq = 3;
  uint32 limit = 4;
  uint64 before_conv_seq = 5;
  string query = 6;
}

message TimelineMessage {
  string msg_id = 1;
  uint64 conv_seq = 2;
  string from_uid = 3;
  Payload payload = 4;
  int64 created_at_ms = 5;
  bool recalled = 6;
  string quote_msg_id = 7;
  repeated ReactionBucket reactions = 8;
}

message GetTimelineResponse {
  string cid = 1;
  repeated TimelineMessage messages = 2;
  bool has_more = 3;
}

// Published on Redis channel gw:{gateway_id} so the owning node can Push.
message GatewayPush {
  string uid = 1;
  string conn_id = 2;
  Push push = 3;
  Typing typing = 4;
  RecallNotify recalled = 5;
  ReadReceipt read = 6;
}

// P0: direct add, both sides become friends immediately. No request/accept.
message AddFriendRequest {
  string uid = 1;
  string peer_uid = 2;
  string hello = 3;
  string source = 4;
}

message AddFriendResponse {
  string peer_uid = 1;
  bool already = 2;
}

message Friend {
  string uid = 1;
  string display_name = 2;
  string avatar_url = 3;
  string remark = 4;
  repeated string tags = 5;
}

message ListFriendsRequest {
  string uid = 1;
}

message ListFriendsResponse {
  repeated Friend friends = 1;
}

message LookupUserRequest {
  string query = 1;
}

message LookupUserResponse {
  string uid = 1;
  bool found = 2;
}

message SearchUsersRequest {
  string query = 1;
  uint32 limit = 2;
}

message SearchUsersResponse {
  repeated UserProfile users = 1;
}

message RegisterRequest {
  string uid = 1;
  string password = 2;
  string email = 3;
  string phone = 4;
}

message LoginRequest {
  string uid = 1;
  string password = 2;
}

message GetProfileRequest {
  string uid = 1;
}

message UpdateProfileRequest {
  string uid = 1;
  string display_name = 2;
  string avatar_url = 3;
  string email = 4;
  string phone = 5;
  string old_password = 6;
  string new_password = 7;
}

message UserProfile {
  string uid = 1;
  string display_name = 2;
  string avatar_url = 3;
  string email = 4;
  string phone = 5;
  string public_key = 6;
}

message UpdateGroupRequest {
  string operator_uid = 1;
  string cid = 2;
  string name = 3;
  string avatar_url = 4;
  string announcement = 5;
  bool join_approval = 6;
  bool set_join_approval = 7;
  bool set_announcement = 8;
}

message SetMuteRequest {
  string uid = 1;
  string cid = 2;
  bool muted = 3;
}

message MuteState {
  string cid = 1;
  bool muted = 2;
}

message ListMutesRequest {
  string uid = 1;
}

message ListMutesResponse {
  repeated string cids = 1;
}

message GroupMember {
  string uid = 1;
  string role = 2;
  string nickname = 3;
  bool muted = 4;
}

message CreateGroupRequest {
  string owner_uid = 1;
  string name = 2;
  repeated string member_uids = 3;
  string mode = 4;
}

message CreateGroupResponse {
  string cid = 1;
  string name = 2;
  string mode = 3;
}

message InviteGroupRequest {
  string operator_uid = 1;
  string cid = 2;
  repeated string member_uids = 3;
}

message KickGroupRequest {
  string operator_uid = 1;
  string cid = 2;
  string member_uid = 3;
}

message GetGroupRequest {
  string uid = 1;
  string cid = 2;
}

message GroupResponse {
  string cid = 1;
  string name = 2;
  string owner_uid = 3;
  repeated GroupMember members = 4;
  string avatar_url = 5;
  bool muted_all = 6;
  string announcement = 7;
  bool join_approval = 8;
  string mode = 9;
}

message RecallMessageRequest {
  string uid = 1;
  string cid = 2;
  string msg_id = 3;
}

message MarkReadRequest {
  string uid = 1;
  string cid = 2;
  uint64 conv_seq = 3;
}

message GetProfilesRequest {
  repeated string uids = 1;
}

message GetProfilesResponse {
  repeated UserProfile users = 1;
}

message RemoveFriendRequest {
  string uid = 1;
  string peer_uid = 2;
}

message RemoveFriendResponse {
  string peer_uid = 1;
}

message FriendRequestState {
  string from_uid = 1;
  string to_uid = 2;
  string status = 3;
  string hello = 4;
  string source = 5;
}

message ListFriendRequestsResponse {
  repeated FriendRequestState incoming = 1;
  repeated FriendRequestState outgoing = 2;
}

message BlockUserRequest {
  string uid = 1;
  string peer_uid = 2;
}

message BlockUserResponse {
  string peer_uid = 1;
  bool blocked = 2;
}

message ListBlocksResponse {
  repeated string uids = 1;
}

message SetRemarkRequest {
  string uid = 1;
  string peer_uid = 2;
  string remark = 3;
}

message LeaveGroupRequest {
  string uid = 1;
  string cid = 2;
}

message TransferOwnerRequest {
  string operator_uid = 1;
  string cid = 2;
  string member_uid = 3;
}

message HideConversationRequest {
  string uid = 1;
  string cid = 2;
}

message HideConversationResponse {
  string cid = 1;
}

message GetReadStateRequest {
  string uid = 1;
  string cid = 2;
  uint64 conv_seq = 3;
}

message GetReadStateResponse {
  string cid = 1;
  uint32 read_count = 2;
  repeated string reader_uids = 3;
  uint32 member_count = 4;
  repeated ReadCursor cursors = 5;
}

message ReadCursor {
  string uid = 1;
  uint64 conv_seq = 2;
}

message SearchMessagesRequest {
  string uid = 1;
  string query = 2;
  uint32 limit = 3;
}

message SearchHit {
  string cid = 1;
  string title = 2;
  TimelineMessage message = 3;
}

message SearchMessagesResponse {
  repeated SearchHit hits = 1;
}

message SetFriendTagsRequest {
  string uid = 1;
  string peer_uid = 2;
  repeated string tags = 3;
}

message TagGroup {
  string name = 1;
  repeated string uids = 2;
}

message ListFriendTagsResponse {
  repeated TagGroup tags = 1;
}

message SetPublicKeyRequest {
  string uid = 1;
  string public_key = 2;
}

message AddStickerRequest {
  string uid = 1;
  string url = 2;
  string pack = 3;
}

message Sticker {
  string id = 1;
  string url = 2;
  string pack = 3;
}

message ListStickersResponse {
  repeated Sticker stickers = 1;
}

message SetMemberRequest {
  string operator_uid = 1;
  string cid = 2;
  string member_uid = 3;
  string nickname = 4;
  string role = 5;
  bool muted = 6;
  bool set_muted = 7;
  bool set_nickname = 8;
  bool set_role = 9;
}

message JoinRequest {
  string uid = 1;
  string from_uid = 2;
  int64 created_at_ms = 3;
}

message ListJoinRequestsResponse {
  string cid = 1;
  repeated JoinRequest requests = 2;
}

message DecideJoinRequest {
  string operator_uid = 1;
  string cid = 2;
  string member_uid = 3;
  bool accept = 4;
}

message ReactionBucket {
  string emoji = 1;
  repeated string uids = 2;
}

message ReactMessageRequest {
  string uid = 1;
  string cid = 2;
  string msg_id = 3;
  string emoji = 4;
}

message ReactionList {
  string msg_id = 1;
  repeated ReactionBucket reactions = 2;
}

message FavoriteRequest {
  string uid = 1;
  string fav_id = 2;
  string cid = 3;
  string msg_id = 4;
}

message Favorite {
  string fav_id = 1;
  string cid = 2;
  string msg_id = 3;
  string from_uid = 4;
  string preview = 5;
  int64 created_at_ms = 6;
  Payload payload = 7;
}

message ListFavoritesRequest {
  string uid = 1;
  string query = 2;
}

message ListFavoritesResponse {
  repeated Favorite favorites = 1;
}

message GroupInvite {
  string token = 1;
  string cid = 2;
  string url = 3;
}

message JoinInviteRequest {
  string uid = 1;
  string token = 2;
}

message SetDraftRequest {
  string uid = 1;
  string cid = 2;
  string text = 3;
}

message PinChatMessageRequest {
  string uid = 1;
  string cid = 2;
  string msg_id = 3;
}

message PinnedMessage {
  string cid = 1;
  string msg_id = 2;
  string from_uid = 3;
  string text = 4;
}

message ReportRequest {
  string uid = 1;
  string cid = 2;
  string msg_id = 3;
  string reason = 4;
}

message UserSettings {
  string uid = 1;
  bool dark = 2;
  string wallpaper = 3;
  bool notify_sound = 4;
  bool notify_preview = 5;
  string dnd_start = 6;
  string dnd_end = 7;
}
